name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # Permite ejecutar la compilación manualmente desde el botón de GitHub Actions

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Instalar dependencias web
        run: npm ci || npm install

      - name: 🏗️ Compilar frontend web (Vite)
        run: npx vite build

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 📱 Configurar Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🔧 Permisos de ejecución para Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: 🚀 Compilar APK Android (Debug)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: 📤 Subir APK generado como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: SUNAT-Go-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
